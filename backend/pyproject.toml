[project]
name = "nexus-crime-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Nexus Crime AI investigation intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt>=4.0,<5.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "neo4j>=5.20,<6.0",
  "redis>=5.0,<6.0",
  "celery>=5.4,<6.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "email-validator>=2.2,<3.0",
  "web3>=7.0,<8.0",
  "pdfplumber>=0.11,<1.0",
  "networkx>=3.3,<4.0",
  "langchain-openai>=0.2,<1.0",
  "py-solc-x>=2.0,<3.0",
  "qdrant-client>=1.12,<2.0",
]

[project.optional-dependencies]
ai = [
  "spacy>=3.7,<4.0",
  "transformers>=4.45,<5.0",
  "torch>=2.4,<3.0",
  "torch-geometric>=2.6,<3.0",
  "langchain>=0.3,<1.0",
  "langchain-neo4j>=0.2,<1.0",
  "shap>=0.46,<1.0",
  "qdrant-client>=1.12,<2.0",
]
test = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "aiosqlite>=0.20,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
