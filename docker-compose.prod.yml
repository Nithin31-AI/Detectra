services:
  backend:
    build: ./backend
    env_file: [.env.production]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}

  celery_worker:
    build: ./backend
    env_file: [.env.production]
    environment:
      POSTGRES_DSN: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
    command: celery -A app.worker.celery_app worker --loglevel=WARNING --concurrency=2
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 6G}

  frontend_build:
    build:
      context: ./nexus-crime-ai-frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
    volumes: [frontend_dist:/out]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend_build]
    ports: ["80:80", "443:443"]
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets:/etc/nginx/tls:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]

  postgres:
    image: postgres:16-alpine
    env_file: [.env.production]
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    env_file: [.env.production]
    environment: {NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}}
    volumes: [neo4j_data:/data, neo4j_logs:/logs]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-replace-me}
    volumes: [redis_data:/data]
    restart: unless-stopped

volumes:
  frontend_dist:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
